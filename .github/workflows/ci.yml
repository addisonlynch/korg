name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2  # scripts/test diffs a PR's merge commit against its base parent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck plugins/korg/bin/* scripts/*
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint
      # On main every push runs the suite; a PR runs it only when scripts/test says it applies.
      - name: pytest
        run: |
          pip install pytest==9.2.0
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then scripts/test HEAD^1; else python -m pytest tests -q; fi
