name: korg respond failure note
description: >-
  Note a failed or cancelled respond run on the PR. Call it with `if: failure() || cancelled()`.
inputs:
  github_token:
    description: Token for the PR lookup and comment.
    default: ${{ github.token }}
  pr:
    description: The respond-gate `pr` output, when the gate got that far.
    default: ''
  action:
    description: The respond-gate `action` output, when the gate got that far.
    default: ''
runs:
  using: composite
  steps:
    # always(): on a job timeout the default success() condition would skip this inside the action.
    - if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR: ${{ inputs.pr || github.event.issue.number || github.event.pull_request.number }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        ACTION: ${{ inputs.action }}
      run: '"$GITHUB_ACTION_PATH/../../../plugins/korg/bin/respond-note-failure"'
